[pytest]
markers =
    ollama: tests that require a reachable Ollama server (deselected by default)
    live_integration: tests that contact a real external service (deselected by default)
    postgres_integration: tests that require the PostgreSQL test database (deselected by default; run scripts/postgres_preflight.py first)
addopts = -m "not ollama and not live_integration and not postgres_integration"
